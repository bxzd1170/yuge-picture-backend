server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  # 所有密钥都不在本文件里：
  #   本地开发 → 项目根目录的 application-local.yml（已在 .gitignore 中，不会入库）
  #   线上部署 → 环境变量（Spring 松散绑定，名字必须照抄）：
  #     SPRING_DATASOURCE_PASSWORD
  #     SPRING_REDIS_PASSWORD
  #     SPRING_SHARDINGSPHERE_DATASOURCE_YTK_PASSWORD
  #     COS_CLIENT_SECRETID / COS_CLIENT_SECRETKEY
  #     ALIYUNAI_APIKEY
  config:
    import: optional:file:./application-local.yml
  application:
    name: yuge-picture-backend
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ytk
    username: yuge
  # Redis 配置
  redis:
    database: 0
    host: 192.168.100.128
    port: 6379
    timeout: 5000
  # Session 配置
  session:
    store-type: redis
    # session 30 天后过期
    timeout: 2592000
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  # 空间图片分表
  shardingsphere:
    datasource:
      names: ytk
      ytk:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/ytk
        username: yuge
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: ytk.picture # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.yuge.manager.sharding.PictureShardingAlgorithm
    props:
      # 生产必须关闭：打开会把每条路由后的 SQL 都打到日志里
      sql-show: false
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 本地排查时可临时打开：
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.yuge.controller
# 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: https://bxzd1170-1499956584.cos.ap-shanghai.myqcloud.com
